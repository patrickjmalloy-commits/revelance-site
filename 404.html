<script>
(function(){
  // Show banner if visitor previously reached the contact gate but didn't submit
  function getCookie(name){
    var m=document.cookie.split(';').map(function(c){return c.trim();}).find(function(c){return c.startsWith(name+'=');});
    return m?m.split('=')[1]:null;
  }
  var wizard=getCookie('rv_wizard');
  var dismissed=sessionStorage.getItem('rv_banner_dismissed');
  if(wizard==='abandoned'&&!dismissed){
    var banner=document.getElementById('rv-banner');
    if(banner){
      // Don't show on the wizard page itself
      if(window.location.pathname.indexOf('plan-your-event')===-1){
        setTimeout(function(){banner.style.display='block';},800);

    }
  }
  var closeBtn=document.getElementById('rv-banner-close');
  if(closeBtn){
    closeBtn.addEventListener('click',function(){
      document.getElementById('rv-banner').style.display='none';
      sessionStorage.setItem('rv_banner_dismissed','1');
    });
  }
})();

<!-- ══ EXTERNAL LINK POPUP ═════════════════════════════════════════════════ -->
<script>
(function(){
  // Open in popup window — keeps Revelance in focus
  // Exceptions: social media and app stores open in new tab as expected
  var NEWTAB_HOSTS=[
    'instagram.com','facebook.com','linkedin.com','twitter.com','x.com',
    'apps.apple.com','play.google.com'
  ];
  function isException(url){
    try{
      var host=new URL(url).hostname.replace(/^www\./,'');
      return NEWTAB_HOSTS.some(function(h){return host===h||host.endsWith('.'+h);});
    }catch(e){return true;}
  }
  function isExternal(url){
    try{
      var host=new URL(url).hostname;
      return host&&host!==window.location.hostname&&host!=='revelanceoh.com';
    }catch(e){return false;}
  }
  function openPopup(url){
    var w=860,h=740;
    var left=Math.max(0,Math.round((screen.width-w)/2));
    var top=Math.max(0,Math.round((screen.height-h)/2));
    var win=window.open(url,'rv_popup','width='+w+',height='+h+',left='+left+',top='+top+',scrollbars=yes,resizable=yes,toolbar=no,menubar=no,location=yes,status=no');
    if(!win||win.closed){window.open(url,'_blank');}
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href]');
    if(!a||!a.href)return;
    if(isExternal(a.href)&&!isException(a.href)){
      e.preventDefault();
      openPopup(a.href);
    }
  });
})();
</script>
