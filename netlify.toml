# --- Noindex headers for utility pages (belt-and-suspenders with robots.txt) ---
[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/events/rsvp/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- Cache headers for images (30 days) ---
[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# --- Cache headers for videos (30 days) ---
[[headers]]
  for = "/images/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# --- Cache headers for event images (30 days) ---
[[headers]]
  for = "/events/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# --- Favicons (7 days — shorter in case you update branding) ---
[[headers]]
  for = "/images/favicon*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- HTML pages (no cache, always fresh) ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Security headers (all pages) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

# --- Font cache (1 year — fonts rarely change) ---
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Web manifest ---
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=604800"

# --- AI & LLM Discovery ---
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "all"

# --- Performance: Link preload hints for homepage ---
[[headers]]
  for = "/"
  [headers.values]
    Link = "</images/logo-r-icon.png>; rel=preload; as=image"

# --- Content-Security-Policy (report-only first, upgrade later) ---
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://*.clarity.ms https://c.bing.com https://script.google.com https://script.googleusercontent.com; frame-src 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com"

# --- Cache HTML subpages (revalidate) ---
[[headers]]
  for = "/blog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# --- Cache sitemap and robots ---
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"
