# ============================================
# Revelance — Netlify Configuration
# Drop this file in the root of your site folder
# ============================================

# --- Build settings ---
[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/calendar.js"
  NODE_VERSION = "18"

# --- Edge function: rich social share previews for events ---
[[edge_functions]]
  path = "/events/"
  function = "event-og"

# --- Edge function: 301 /blog/*.html → extensionless canonical (v6_183) ---
[[edge_functions]]
  path = "/blog/*"
  function = "blog-html-301"

# --- Redirect www to non-www (pick one canonical domain for SEO) ---
[[redirects]]
  from = "/blog/workspace-and-event-"
  to = "/blog/workspace-and-event-venue-same-building"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/taproom"
  to = "/taphouse/"
  status = 301

[[redirects]]
  from = "/taproom/*"
  to = "/taphouse/"
  status = 301

[[redirects]]
  from = "/contact/community/"
  to = "/community/"
  status = 301

[[redirects]]
  from = "https://www.revelanceoh.com/*"
  to = "https://revelanceoh.com/:splat"
  status = 301
  force = true

# --- Force HTTPS ---
[[redirects]]
  from = "http://revelanceoh.com/*"
  to = "https://revelanceoh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.revelanceoh.com/*"
  to = "https://revelanceoh.com/:splat"
  status = 301
  force = true

# --- Wix URL redirects (old site → new site) ---

[[redirects]]
  from = "/the-lounge-membership"
